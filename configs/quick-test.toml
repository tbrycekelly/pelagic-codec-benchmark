schema_version = 1

[dataset]
path = "../tests/fixtures/synthetic"

[segmentation]
methods = ["fixed", "otsu"]
fixed_threshold = 118
minimum_area = 2

[[codecs]]
name = "png"

[[codecs]]
name = "jpeg"
